name: Windows x64 release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must match VERSION in whimbox_updater.py)
        required: true
        type: string
        default: '1.3.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_NAME -notmatch '\Av(?<version>[0-9]+\.[0-9]+\.[0-9]+)\z') {
              throw "Tag must have the form vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
            }
            $version = $Matches.version
          } else {
            $version = $env:INPUT_VERSION
          }
          if ($version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw "Version must have the form MAJOR.MINOR.PATCH: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build and package Windows x64 release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/build_windows.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release-assets

      - name: Smoke-test standalone executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Join-Path $PWD "release-assets/whimbox-updater-v$env:RELEASE_VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing standalone executable: $exe" }
          $versionOutput = & $exe --version
          if ($LASTEXITCODE -ne 0 -or ($versionOutput -join "`n").Trim() -ne "Whimbox Updater $env:RELEASE_VERSION") {
            throw "--version smoke test failed (exit $LASTEXITCODE): $versionOutput"
          }
          & $exe --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "--help smoke test failed (exit $LASTEXITCODE)" }
          $dataDir = & $exe --print-data-dir
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($dataDir -join "`n"))) {
            throw "--print-data-dir smoke test failed (exit $LASTEXITCODE)"
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out CHANGELOG.md
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-release-assets
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/whimbox-updater-v*.exe
            release-assets/whimbox-updater-v*-windows-x64.zip
            release-assets/whimbox-updater-v*-source.zip

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["RELEASE_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"(?ms)^## v{re.escape(version)}\s*\n(.*?)(?=^## |\Z)", text)
          body = match.group(1).strip() if match else f"Windows x64 standalone updater v{version}."
          body += "\n\n校验下载文件：请核对 `SHA256SUMS.txt`。"
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          PY

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${RELEASE_VERSION}"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match built version $version" >&2
            exit 1
          fi
          expected=(
            "whimbox-updater-v${version}.exe"
            "whimbox-updater-v${version}-windows-x64.zip"
            "whimbox-updater-v${version}-source.zip"
            "SHA256SUMS.txt"
          )
          actual_count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets; found $actual_count" >&2
            exit 1
          fi
          assets=()
          for name in "${expected[@]}"; do
            path="release-assets/${name}"
            if [[ ! -f "$path" ]]; then
              echo "Missing release asset: $name" >&2
              exit 1
            fi
            assets+=("$path")
          done
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Whimbox Updater $version" \
            --notes-file release-notes.md
